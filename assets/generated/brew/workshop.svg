<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="Алхимическая мастерская с окном на живописную горную долину">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#cdeaf5"/><stop offset=".45" stop-color="#9dcfe4"/><stop offset="1" stop-color="#79acc7"/></linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff4b6"/><stop offset="1" stop-color="#ffc969"/></linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#966647"/><stop offset=".48" stop-color="#704834"/><stop offset="1" stop-color="#4a2e25"/></linearGradient>
    <linearGradient id="woodDark" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#604034"/><stop offset="1" stop-color="#2e1d19"/></linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#dfc09a"/><stop offset="1" stop-color="#b9865e"/></linearGradient>
    <linearGradient id="counter" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ad744d"/><stop offset=".16" stop-color="#8b593b"/><stop offset="1" stop-color="#533226"/></linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8cdef0"/><stop offset="1" stop-color="#4b9fc4"/></linearGradient>
    <linearGradient id="lamp" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff6b1"/><stop offset=".5" stop-color="#ffc45b"/><stop offset="1" stop-color="#e76f29"/></linearGradient>
    <radialGradient id="sunGlow"><stop stop-color="#ffd881" stop-opacity=".55"/><stop offset="1" stop-color="#ffb450" stop-opacity="0"/></radialGradient>
    <radialGradient id="lampGlow"><stop stop-color="#ffd67b" stop-opacity=".56"/><stop offset="1" stop-color="#ffad49" stop-opacity="0"/></radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>

  <rect width="1200" height="720" fill="#35231d"/>
  <rect x="16" y="18" width="1168" height="526" rx="24" fill="url(#wall)"/>

  <!-- window and exterior vista -->
  <rect x="148" y="50" width="904" height="444" rx="22" fill="#3b281f"/>
  <rect x="178" y="78" width="844" height="388" rx="12" fill="url(#sky)"/>
  <circle cx="887" cy="139" r="53" fill="url(#sun)"/>
  <circle cx="887" cy="139" r="126" fill="url(#sunGlow)"/>

  <!-- atmospheric clouds -->
  <g fill="#edf4f4" opacity=".66">
    <path d="M222 142c28-31 66-25 82 2 28-12 60 6 64 31H204c1-14 7-25 18-33Z"/>
    <path d="M702 112c23-24 57-20 70 2 23-10 50 6 53 26H684c2-12 8-21 18-28Z" opacity=".58"/>
  </g>

  <!-- far mountain range -->
  <polygon points="178,300 265,221 338,270 430,151 548,291 652,177 772,292 878,194 1022,309 1022,466 178,466" fill="#74849b"/>
  <polygon points="178,324 265,221 289,251 338,270 430,151 465,211 548,291 652,177 688,231 772,292 878,194 913,242 1022,309 1022,466 178,466" fill="#98a7b6" opacity=".72"/>
  <g fill="#eef3f0" opacity=".9">
    <polygon points="242,249 265,221 291,252 274,248"/>
    <polygon points="401,190 430,151 465,211 436,193"/>
    <polygon points="625,211 652,177 689,231 659,213"/>
    <polygon points="849,228 878,194 914,242 885,229"/>
  </g>

  <!-- foothills -->
  <path d="M178 327 C294 288 393 301 495 337 C625 382 730 338 839 314 C919 297 973 305 1022 318 L1022 466 L178 466Z" fill="#8fa86b"/>
  <path d="M178 372 C334 329 423 351 548 391 C672 430 820 366 1022 352 L1022 466 L178 466Z" fill="#6e9258"/>
  <path d="M178 415 C336 377 463 389 589 424 C733 463 868 411 1022 399 L1022 466 L178 466Z" fill="#587e4d" opacity=".88"/>

  <!-- winding river -->
  <path d="M533 337 C579 355 612 384 642 403 C676 424 725 432 771 443 C797 449 827 456 856 466 H714 C672 449 631 437 600 419 C567 400 546 376 512 353Z" fill="url(#river)"/>
  <path d="M548 342 C586 360 616 386 647 402 C682 421 724 429 759 438" fill="none" stroke="#b5eff7" stroke-width="10" stroke-linecap="round" opacity=".45"/>

  <!-- village -->
  <g transform="translate(320 333)">
    <rect x="0" y="34" width="46" height="36" fill="#e7c38f"/><polygon points="-6,34 23,9 52,34" fill="#b95f39"/><rect x="18" y="46" width="10" height="24" fill="#7e543b"/>
    <rect x="58" y="46" width="36" height="28" fill="#f0d3a2"/><polygon points="53,46 76,26 99,46" fill="#9d5136"/>
    <rect x="108" y="37" width="32" height="34" fill="#dcb47e"/><polygon points="102,37 124,17 146,37" fill="#c46a3d"/>
    <rect x="137" y="1" width="13" height="54" fill="#bba076"/><polygon points="135,2 143,-13 152,2" fill="#8e5941"/>
  </g>

  <!-- trees, varied sizes -->
  <g>
    <g transform="translate(231 326)"><rect x="-5" y="32" width="10" height="28" fill="#5b4938"/><polygon points="0,-4 -24,41 24,41" fill="#32674b"/><polygon points="0,12 -29,52 29,52" fill="#3e7a53"/></g>
    <g transform="translate(276 355) scale(.7)"><rect x="-5" y="32" width="10" height="28" fill="#5b4938"/><polygon points="0,-4 -24,41 24,41" fill="#356a4b"/><polygon points="0,12 -29,52 29,52" fill="#497e56"/></g>
    <g transform="translate(385 350) scale(.62)"><rect x="-5" y="32" width="10" height="28" fill="#5b4938"/><polygon points="0,-4 -24,41 24,41" fill="#2f6548"/><polygon points="0,12 -29,52 29,52" fill="#417752"/></g>
    <g transform="translate(918 324) scale(1.05)"><rect x="-5" y="32" width="10" height="28" fill="#5b4938"/><polygon points="0,-4 -24,41 24,41" fill="#2f6548"/><polygon points="0,12 -29,52 29,52" fill="#427c55"/></g>
    <g transform="translate(965 351) scale(.74)"><rect x="-5" y="32" width="10" height="28" fill="#5b4938"/><polygon points="0,-4 -24,41 24,41" fill="#32684a"/><polygon points="0,12 -29,52 29,52" fill="#477d56"/></g>
    <g transform="translate(815 350) scale(.58)"><rect x="-5" y="32" width="10" height="28" fill="#5b4938"/><polygon points="0,-4 -24,41 24,41" fill="#2f6247"/><polygon points="0,12 -29,52 29,52" fill="#3f7451"/></g>
  </g>

