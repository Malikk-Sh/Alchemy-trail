  <rect x="585" y="78" width="45" height="388" fill="url(#woodDark)"/>
  <rect x="178" y="78" width="844" height="24" fill="#5a392d"/>
  <rect x="178" y="442" width="844" height="24" fill="#4b3026"/>
  <rect x="148" y="50" width="904" height="18" rx="9" fill="#51352a" opacity=".86"/>

  <!-- ceiling beams -->
  <rect width="1200" height="52" fill="url(#woodDark)"/>
  <polygon points="22,0 105,0 330,251 287,281" fill="url(#wood)" opacity=".92"/>
  <polygon points="1178,0 1093,0 874,251 918,281" fill="url(#wood)" opacity=".92"/>

  <!-- hanging herb bundles -->
  <g transform="translate(222 36)" opacity=".95">
    <path d="M0 0V58" stroke="#4b3529" stroke-width="5"/>
    <path d="M-18 48c-14 10-10 29 8 27 15-2 18-18 10-29Z" fill="#557a43"/>
    <path d="M14 52c15 8 11 28-6 27-15-1-20-16-12-28Z" fill="#6d914e"/>
    <path d="M-4 62c-8 16 2 31 16 22 13-8 7-24-5-29Z" fill="#447142"/>
  </g>
  <g transform="translate(965 42) scale(.86)" opacity=".9">
    <path d="M0 0V56" stroke="#4b3529" stroke-width="5"/>
    <path d="M-17 49c-13 11-7 28 9 25 15-3 16-18 8-28Z" fill="#6b8650"/>
    <path d="M13 48c16 9 12 27-5 27-14 0-19-16-10-27Z" fill="#4b7544"/>
  </g>

  <!-- left shelving with bottles/books -->
  <g transform="translate(28 112)">
    <rect width="126" height="310" rx="9" fill="#654331"/>
    <rect x="12" y="18" width="102" height="14" fill="#3c281f"/>
    <rect x="12" y="112" width="102" height="14" fill="#3c281f"/>
    <rect x="12" y="209" width="102" height="14" fill="#3c281f"/>
    <g transform="translate(26 42)"><rect x="0" y="20" width="26" height="41" rx="7" fill="#8cc7bf"/><rect x="7" y="8" width="12" height="16" fill="#c89b68"/><rect x="36" y="28" width="23" height="33" rx="5" fill="#d6a16b"/><rect x="43" y="16" width="9" height="14" fill="#9f724c"/><rect x="70" y="16" width="20" height="45" rx="6" fill="#8b75a6"/><rect x="75" y="5" width="10" height="14" fill="#b48a59"/></g>
    <g transform="translate(22 136)"><rect x="0" y="18" width="20" height="45" rx="5" fill="#d2b17c"/><rect x="5" y="5" width="10" height="16" fill="#9c714d"/><rect x="30" y="27" width="31" height="36" rx="8" fill="#84a867"/><rect x="39" y="12" width="13" height="19" fill="#b78a59"/><rect x="72" y="22" width="19" height="41" rx="6" fill="#6fa2a6"/><rect x="77" y="8" width="9" height="17" fill="#b08252"/></g>
    <g transform="translate(22 237)"><rect width="76" height="13" rx="3" fill="#a06b47"/><rect x="8" y="14" width="85" height="13" rx="3" fill="#c1925f"/><rect x="20" y="28" width="69" height="13" rx="3" fill="#87513b"/></g>
  </g>

  <!-- right hanging banner -->
  <g transform="translate(1041 80)">
    <rect x="0" y="0" width="125" height="250" rx="5" fill="#e5ca9f"/>
    <polygon points="0,250 62,218 125,250" fill="#d6b88c"/>
    <path d="M63 64c-30 17-31 49-2 67 30-17 32-50 2-67Z" fill="#657854"/>
    <path d="M61 132c-13 16-11 39 2 54" fill="none" stroke="#657854" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- lantern -->
  <g transform="translate(68 44)">
    <ellipse cx="42" cy="92" rx="92" ry="92" fill="url(#lampGlow)" filter="url(#soft)" opacity=".5"/>
    <path d="M42 0v36" stroke="#2a201d" stroke-width="11"/>
    <rect x="8" y="36" width="68" height="108" rx="8" fill="#3b2a24"/>
    <rect x="20" y="52" width="44" height="74" rx="5" fill="url(#lamp)"/>
    <rect x="26" y="58" width="32" height="61" rx="4" fill="#fff5ba" opacity=".44"/>
    <polygon points="8,36 42,18 76,36" fill="#2f2420"/>
    <path d="M14 44l56 91M70 44L14 135" stroke="#1e1715" stroke-width="4" opacity=".6"/>
  </g>

  <!-- sill and counter -->
  <rect x="0" y="498" width="1200" height="62" fill="#6a4433"/>
  <rect x="0" y="520" width="1200" height="200" fill="url(#counter)"/>
  <rect x="0" y="520" width="1200" height="25" fill="#bf8153"/>
  <rect x="0" y="547" width="1200" height="15" fill="#6e432f" opacity=".84"/>
  <path d="M0 612H1200M0 671H1200" stroke="#462a22" stroke-width="5" opacity=".38"/>
  <path d="M198 548V720M406 548V720M812 548V720M1015 548V720" stroke="#462a22" stroke-width="5" opacity=".22"/>

  <!-- foreground props on counter -->
  <g transform="translate(1044 431)"><rect x="-38" y="61" width="76" height="60" rx="6" fill="#75503d"/><path d="M0 67c-42-14-54-46-28-56 23-9 35 22 28 56Z" fill="#507b49"/><path d="M0 69c37-15 50-51 25-60C4 2-8 36 0 69Z" fill="#699957"/><path d="M0 67c-14-34-3-65 19-62 40 6 29 44-19 62Z" fill="#3f6d43"/></g>
  <g transform="translate(921 480)"><rect x="0" y="20" width="104" height="25" rx="4" fill="#81543b"/><rect x="14" y="0" width="89" height="25" rx="4" fill="#bd8d5d"/><path d="M20 8h60" stroke="#e3be84" stroke-width="2" opacity=".55"/></g>
  <g transform="translate(182 486)"><ellipse cx="36" cy="42" rx="38" ry="10" fill="#2b1d18" opacity=".2"/><path d="M8 18h56l-5 34H13Z" fill="#b48a68"/><ellipse cx="36" cy="18" rx="28" ry="8" fill="#d0ad86"/><path d="M23 12c-8-18 4-26 15-11 6-18 22-11 16 8" fill="none" stroke="#657e49" stroke-width="8" stroke-linecap="round"/></g>
</svg>
