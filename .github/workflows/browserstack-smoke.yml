name: BrowserStack Mobile Smoke

on:
  workflow_dispatch:

jobs:
  mobile-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Verify BrowserStack secrets are available
        shell: bash
        run: |
          test -n "$BROWSERSTACK_USERNAME" || (echo "BROWSERSTACK_USERNAME secret is missing" && exit 1)
          test -n "$BROWSERSTACK_ACCESS_KEY" || (echo "BROWSERSTACK_ACCESS_KEY secret is missing" && exit 1)

      - name: Run BrowserStack real-device smoke tests
        run: npm run test:e2e:browserstack
